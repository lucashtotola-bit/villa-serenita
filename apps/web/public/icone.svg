<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do aplicativo: o monograma da Villa sobre o verde da identidade,
       com o filete de assinatura (verde -> terracota) que abre toda tela.
       Fundo cobre o quadrado inteiro para servir também como ícone maskable. -->
  <defs>
    <linearGradient id="assinatura" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93a35f"/>
      <stop offset="1" stop-color="#a9553f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#161c0d"/>
  <rect x="26" y="26" width="460" height="460" rx="60" fill="#212a14"/>
  <text x="256" y="308" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="230" fill="#dfe3cb" text-anchor="middle">VS</text>
  <rect x="146" y="360" width="220" height="12" rx="6" fill="url(#assinatura)"/>
</svg>
